        /* Login Overlay */
        #login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;

        .login-box {
            background: white;

            border-radius: 12px;

            text-align: center;
            width: 300px;
        }
        .login-box h2 { margin-bottom: 20px; color: #1c1e21; }
        .login-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #dddfe2;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .login-box button {
            width: 100%;
            padding: 12px;
            background: #1877f2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .login-box button:hover { background: #166fe5; }
        #error-msg { color: #d93025; font-size: 14px; margin-top: 10px; display: none; }
